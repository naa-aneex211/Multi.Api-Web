<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meyy Hub - Spatial Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #eef2f6;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #94a3b8;
            
            --liquid-bg: rgba(255, 255, 255, 0.45);
            --liquid-specular: rgba(255, 255, 255, 0.85);
            --liquid-border: rgba(255, 255, 255, 0.6);
            --liquid-shadow: 0 20px 50px rgba(0, 0, 0, 0.04), 0 10px 20px rgba(0, 0, 0, 0.02);
            
            --accent-glow-cyan: #c2e9fb;
            --accent-glow-pink: #ffd1dc;
            --accent-glow-purple: #dcd6f7;
            
            --state-online: #10b981;
            --state-offline: #f43f5e;
            --spring-easing: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Quicksand', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: var(--bg-canvas);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .spatial-viewport {
            position: relative;
            width: 100%;
            min-height: 100vh;
            perspective: 1200px;
            perspective-origin: 50% 20%;
            overflow: hidden;
            padding: 24px;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.55;
            z-index: 0;
            pointer-events: none;
            animation: spatialDrift 18s infinite alternate ease-in-out;
        }
        .orb-1 { width: 550px; height: 550px; background: var(--accent-glow-cyan); top: -8%; left: 5%; }
        .orb-2 { width: 650px; height: 650px; background: var(--accent-glow-pink); bottom: -10%; right: 5%; animation-delay: -6s; }
        .orb-3 { width: 450px; height: 450px; background: var(--accent-glow-purple); top: 30%; left: 45%; animation-delay: -11s; }

        @keyframes spatialDrift {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            100% { transform: translateY(40px) rotate(10deg) scale(1.08); }
        }

        .glass-liquid {
            background: linear-gradient(180deg, #ffffff 0%, #ffffff 67%, #e2e8f0 100%);
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: var(--liquid-shadow), inset 0 1px 1px var(--liquid-specular);
        }

        .studio-wrapper {
            position: relative;
            z-index: 10;
            max-width: 1450px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .studio-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 26px;
            border-radius: 28px;
            position: relative;
            z-index: 1000;
            background: #ffffff !important;
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-cube {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #0f172a, #334155);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.2);
        }

        .brand-titles h1 { font-size: 19px; font-weight: 800; letter-spacing: -0.5px; color: var(--text-primary); }
        .brand-titles span { font-size: 12px; color: var(--text-tertiary); font-weight: 600; }

        .service-dock {
            display: flex;
            background: rgba(255, 255, 255, 0.35);
            padding: 6px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
            gap: 6px;
        }

        .dock-item {
            background: transparent;
            border: none;
            outline: none;
            padding: 8px 18px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.25s var(--spring-easing);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dock-item:hover {
            color: var(--text-primary);
            transform: translateY(-1px);
        }

        .dock-item.active {
            background: #ffffff;
            color: var(--text-primary);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
            transform: scale(1.02);
        }

        .header-utilities {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status-indicator-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 40px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .pulsing-core {
            width: 8px;
            height: 8px;
            background: var(--state-online);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--state-online);
            animation: corePulse 2s infinite ease-in-out;
        }

        @keyframes corePulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.5; }
        }

        .glass-action-btn {
            background: #0f172a;
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s var(--spring-easing);
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.15);
        }

        .glass-action-btn:hover {
            background: #1e293b;
            transform: translateY(-2px) scale(1.02);
        }

        .workspace-stage {
            display: flex;
            flex-direction: column;
            gap: 32px;
            transform-style: preserve-3d;
        }

        .key-cluster {
            border-radius: 32px;
            padding: 28px;
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
        }

        .cluster-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            transform: translateZ(20px);
        }

        .cluster-tag-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .key-badge {
            background: #0f172a;
            color: #fff;
            padding: 6px 14px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.1);
        }

        .stat-capsule {
            background: #ffffff;
            border: 1px solid rgba(255, 255, 255, 1);
            padding: 8px 18px;
            border-radius: 14px;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--text-secondary);
            box-shadow: 
                0 6px 18px rgba(15, 23, 42, 0.12),
                0 2px 6px rgba(15, 23, 42, 0.08),
                inset 0 1px 1px rgba(255, 255, 255, 1);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .stat-capsule b {
            color: var(--text-primary);
            font-weight: 800;
        }

        .acc-matrix {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 20px;
            transform-style: preserve-3d;
        }

        .acc-card-wrapper {
            perspective: 1000px;
            cursor: pointer;
        }

        .acc-card-3d {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(241, 245, 249, 0.65) 50%, rgba(226, 232, 240, 0.5) 100%) !important;
            backdrop-filter: blur(28px) saturate(200%);
            -webkit-backdrop-filter: blur(28px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 1) !important;
            border-radius: 24px;
            padding: 22px;
            transform-style: preserve-3d;
            will-change: transform;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease, border-color 0.3s ease;
            box-shadow: 
                0 18px 45px rgba(15, 23, 42, 0.08),
                0 6px 18px rgba(15, 23, 42, 0.05),
                0 1px 3px rgba(0, 0, 0, 0.03),
                inset 0 1.5px 2px rgba(255, 255, 255, 1),
                inset 0 -1.5px 2px rgba(203, 213, 225, 0.3) !important;
            pointer-events: none;
        }

        .acc-card-wrapper:hover .acc-card-3d {
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.08), inset 0 1px 3px rgba(255, 255, 255, 1);
            border-color: rgba(255, 255, 255, 0.95);
        }

        .acc-card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            transform: translateZ(15px);
        }

        .acc-title { font-size: 16px; font-weight: 800; color: var(--text-primary); }

        .state-orb {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }
        .state-orb.online { color: var(--state-online); background: var(--state-online); }
        .state-orb.offline { color: var(--state-offline); background: var(--state-offline); }

        .acc-card-body {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            transform: translateZ(10px);
        }

        .field-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .field-line span { color: var(--text-tertiary); font-weight: 600; }
        .field-line b { color: var(--text-primary); font-weight: 700; }

        .acc-click-hint {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            font-size: 11px;
            font-weight: 700;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transform: translateZ(5px);
        }

        .empty-matrix {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .empty-key-msg {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-tertiary);
            background: rgba(15, 23, 42, 0.04);
            border: 1px dashed rgba(15, 23, 42, 0.15);
            padding: 16px 32px;
            border-radius: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .spatial-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.25);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .spatial-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-sheet {
            width: 520px;
            max-width: 92%;
            border-radius: 36px;
            padding: 34px;
            transform: scale(0.9) translateY(40px) rotateX(10deg);
            transition: transform 0.4s var(--spring-easing);
            background: rgba(255, 255, 255, 0.82) !important;
            backdrop-filter: blur(35px) saturate(200%) !important;
            -webkit-backdrop-filter: blur(35px) saturate(200%) !important;
            border: 1px solid rgba(255, 255, 255, 1) !important;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.12), inset 0 1px 2px rgba(255, 255, 255, 1) !important;
        }

        .spatial-overlay.active .modal-sheet {
            transform: scale(1) translateY(0) rotateX(0deg);
        }

        .sheet-handle {
            width: 44px;
            height: 5px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            margin: -10px auto 20px auto;
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
        }
        .sheet-tag { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--text-tertiary); }
        .sheet-header h2 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }

        .sheet-close {
            background: rgba(0, 0, 0, 0.05);
            border: none;
            width: 32px; height: 32px;
            border-radius: 50%;
            font-size: 16px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .sheet-close:hover { background: rgba(0, 0, 0, 0.1); color: var(--text-primary); }

        .sheet-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sheet-field {
            background: rgba(255, 255, 255, 0.65) !important;
            border: 1px solid rgba(255, 255, 255, 0.9) !important;
            padding: 14px 18px;
            border-radius: 18px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.02);
        }
        .sheet-field label { font-size: 11px; text-transform: uppercase; font-weight: 700; color: var(--text-tertiary); display: block; margin-bottom: 4px; }
        .sheet-field p { font-size: 15px; font-weight: 700; color: var(--text-primary); word-break: break-all; }

        .detail-dropdown-ui {
            margin-top: 16px;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            padding: 16px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.04);
            max-height: 250px;
            overflow-y: auto;
        }

        .detail-dropdown-ui.hidden { display: none; }

        .json-ui-grid { display: flex; flex-direction: column; gap: 8px; }

        .json-ui-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.9);
        }

        .json-ui-key { font-size: 12px; font-weight: 800; color: var(--text-secondary); text-transform: uppercase; }
        .json-ui-val { font-size: 13px; font-weight: 700; color: var(--text-primary); font-family: monospace; }

        .sheet-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 28px;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(0, 0, 0, 0.1);
            padding: 12px 22px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-secondary:hover { background: rgba(0, 0, 0, 0.05); }

        .btn-primary {
            background: #0f172a;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.15);
            transition: all 0.2s ease;
        }
        .btn-primary:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="spatial-viewport">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>

        <div class="studio-wrapper">
            <header class="studio-header glass-liquid">
                <div class="brand">
                    <div class="brand-cube">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 2 7 12 12 22 7 12 2"/>
                            <polyline points="2 17 12 22 22 17"/>
                            <polyline points="2 12 12 17 22 12"/>
                        </svg>
                    </div>
                    <div class="brand-titles">
                        <h1>Meyy Hub</h1>
                        <span>Spatial Management Studio</span>
                    </div>
                </div>

                <nav class="service-dock" id="serviceDock">
                </nav>

                <div class="header-utilities">
                    <div class="status-indicator-pill">
                        <span class="pulsing-core"></span>
                        <span id="activeNodesCount">0 Nodes Live</span>
                    </div>
                    <button class="glass-action-btn" id="syncStudioBtn" onclick="fetchData()">Sync Realtime</button>
                </div>
            </header>

            <main class="main-stage">
                <div id="workspaceStage" class="workspace-stage">
                    <div class="empty-matrix">
                        <div class="empty-key-msg">Connecting to backend cluster...</div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="spatial-overlay" id="accModal" onclick="closeSpatialModal(event)">
        <div class="modal-sheet glass-liquid" onclick="event.stopPropagation()">
            <div class="sheet-handle"></div>
            <div class="sheet-header">
                <div>
                    <span class="sheet-tag">Account Inspector</span>
                    <h2 id="modalAccName">Unknown</h2>
                </div>
                <button class="sheet-close" onclick="closeSpatialModal(null, true)">×</button>
            </div>
            <div class="sheet-grid" id="modalDetails"></div>
            <div id="accDetailDropdown" class="detail-dropdown-ui hidden"></div>
            <div class="sheet-footer" style="justify-content: space-between;">
                <button class="btn-secondary" onclick="closeSpatialModal(null, true)">Dismiss</button>
                <div style="display: flex; gap: 12px;">
                    <button class="btn-secondary" id="toggleDetailBtn" onclick="toggleAccDetail()">Detail</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let rawClusterData = {};
        let activeService = "";

        async function fetchData() {
            const btn = document.getElementById("syncStudioBtn");
            if (btn) btn.innerText = "Syncing...";

            try {
                const response = await fetch('/dashboard-data');
                const data = await response.json();
                rawClusterData = (data && typeof data === 'object') ? data : {};
            } catch (err) {
                rawClusterData = {};
            } finally {
                if (btn) btn.innerText = "Sync Realtime";
                renderServiceDock();
                renderWorkspace();
            }
        }

        function renderServiceDock() {
            const dock = document.getElementById("serviceDock");
            dock.innerHTML = "";
            const services = Object.keys(rawClusterData);
            
            if (services.length === 0) {
                activeService = "";
                return;
            }

            if (!activeService || !services.includes(activeService)) {
                activeService = services[0];
            }

            services.forEach(svc => {
                const btn = document.createElement("button");
                btn.className = `dock-item ${svc === activeService ? 'active' : ''}`;
                btn.innerText = svc.toUpperCase();
                btn.onclick = () => {
                    activeService = svc;
                    renderServiceDock();
                    renderWorkspace();
                };
                dock.appendChild(btn);
            });
        }

        function renderWorkspace() {
            const stage = document.getElementById("workspaceStage");
            stage.innerHTML = "";

            const services = Object.keys(rawClusterData);
            if (services.length === 0 || !activeService || !rawClusterData[activeService]) {
                stage.innerHTML = `<div class="empty-matrix"><div class="empty-key-msg">No active services or rooms tracking</div></div>`;
                const nodePill = document.getElementById("activeNodesCount");
                if (nodePill) nodePill.innerText = `0 Nodes Live`;
                return;
            }

            const currentServiceGroups = rawClusterData[activeService];
            const groupKeys = Object.keys(currentServiceGroups);
            let totalOnline = 0;

            if (groupKeys.length === 0) {
                stage.innerHTML = `<div class="empty-matrix"><div class="empty-key-msg">No active groups tracking</div></div>`;
                const nodePill = document.getElementById("activeNodesCount");
                if (nodePill) nodePill.innerText = `0 Nodes Live`;
                return;
            }

            groupKeys.forEach(groupName => {
                const accounts = currentServiceGroups[groupName];
                const accKeys = Object.keys(accounts);

                const cluster = document.createElement("section");
                cluster.className = "key-cluster glass-liquid";

                let accountsHtml = "";
                if (accKeys.length === 0) {
                    accountsHtml = `<div class="empty-matrix"><div class="empty-key-msg">No nodes active</div></div>`;
                } else {
                    accKeys.forEach(accName => {
                        const acc = accounts[accName];
                        const isOnline = acc.Status === "Online";
                        if (isOnline) totalOnline++;

                        const timeAgo = acc.LastTime ? Math.max(0, Math.floor(Date.now() / 1000 - acc.LastTime)) + 's ago' : 'Just now';

                        let fieldDetails = '';
                        for (const [key, value] of Object.entries(acc)) {
                            if (!['Name', 'Status', 'LastTime'].includes(key)) {
                                fieldDetails += `<div class="field-line"><span>${key}:</span> <b>${value}</b></div>`;
                            }
                        }

                        const encodedData = encodeURIComponent(JSON.stringify(acc));

                        accountsHtml += `
                            <div class="acc-card-wrapper" onclick="openSpatialModal('${encodedData}')">
                                <div class="acc-card-3d">
                                    <div class="acc-card-head">
                                        <span class="acc-title">${acc.Name || 'Unknown'}</span>
                                        <div class="state-orb ${isOnline ? 'online' : 'offline'}"></div>
                                    </div>
                                    <div class="acc-card-body">
                                        ${fieldDetails}
                                        <div class="field-line"><span>Heartbeat:</span> <b>${timeAgo}</b></div>
                                    </div>
                                    <div class="acc-click-hint">
                                        <span>Inspect Node</span>
                                        <span>→</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }

                cluster.innerHTML = `
                    <div class="cluster-head">
                        <div class="cluster-tag-group">
                            <span class="key-badge">${groupName}</span>
                        </div>
                        <div class="cluster-stats">
                            <div class="stat-capsule">Nodes: <b>${accKeys.length}</b></div>
                        </div>
                    </div>
                    <div class="acc-matrix ${accKeys.length === 0 ? 'empty-matrix' : ''}">
                        ${accountsHtml}
                    </div>
                `;

                stage.appendChild(cluster);
            });

            const nodePill = document.getElementById("activeNodesCount");
            if (nodePill) nodePill.innerText = `${totalOnline} Nodes Live`;

            bind3DTilt(".acc-card-wrapper", ".acc-card-3d");
        }

        function bind3DTilt(wrapperSelector, cardSelector) {
            const wrappers = document.querySelectorAll(wrapperSelector);

            wrappers.forEach(wrapper => {
                const card = wrapper.querySelector(cardSelector);
                if (!card) return;

                wrapper.addEventListener("mousemove", (e) => {
                    const rect = wrapper.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;

                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;

                    const rotateX = -((y - centerY) / centerY) * 10;
                    const rotateY = ((x - centerX) / centerX) * 10;

                    card.style.transform = `rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) translateY(-6px) scale(1.02)`;
                });

                wrapper.addEventListener("mouseleave", () => {
                    card.style.transform = "rotateX(0deg) rotateY(0deg) translateY(0px) scale(1)";
                });
            });
        }

        function openSpatialModal(encodedData) {
            const acc = JSON.parse(decodeURIComponent(encodedData));
            const modal = document.getElementById("accModal");
            const grid = document.getElementById("modalDetails");
            
            document.getElementById("modalAccName").innerText = acc.Name || 'Unknown';
            
            grid.innerHTML = `
                <div class="sheet-field">
                    <label>Telemetry Status</label>
                    <p>${acc.Status || 'Unknown'}</p>
                </div>
            `;

            const detailDropdown = document.getElementById("accDetailDropdown");
            let jsonUiHtml = '<div class="json-ui-grid">';
            for (const [key, value] of Object.entries(acc)) {
                jsonUiHtml += `
                    <div class="json-ui-row">
                        <span class="json-ui-key">${key}</span>
                        <span class="json-ui-val">${value}</span>
                    </div>
                `;
            }
            jsonUiHtml += '</div>';
            detailDropdown.innerHTML = jsonUiHtml;
            detailDropdown.classList.add("hidden");
            document.getElementById("toggleDetailBtn").innerText = "Detail";

            modal.classList.add("active");
        }

        function toggleAccDetail() {
            const dropdown = document.getElementById("accDetailDropdown");
            const btn = document.getElementById("toggleDetailBtn");
            if (dropdown.classList.contains("hidden")) {
                dropdown.classList.remove("hidden");
                btn.innerText = "Hide Detail";
            } else {
                dropdown.classList.add("hidden");
                btn.innerText = "Detail";
            }
        }

        function closeSpatialModal(e, force = false) {
            if (force || e.target.id === "accModal") {
                document.getElementById("accModal").classList.remove("active");
            }
        }

        fetchData();
        setInterval(fetchData, 8000);
    </script>
</body>
</html>
